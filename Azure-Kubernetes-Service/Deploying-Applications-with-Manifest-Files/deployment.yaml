# // IMPORTANT: THE AKS Cluster and the resource group need to be defined before running this script


# A Kubernetes Deployment — the desired-state object for a stateless workload.
# It keeps the requested number of identical pods running and replaces any that
# crash, get deleted, or land on a failed node. You describe the end state; the
# control plane makes the cluster match it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  labels:
    app: hello-web
spec:
  # How many copies of the pod template below are running. 3 is fixed.
  # Traffic does not change it. HPA or KEDA would own this number instead.
  # See LS_NOTES.md, AUTO-SCALING: HPA OR KEDA. Commands are commented in aks-deploy.sh.
  replicas: 3 
  # The controller manages every pod whose labels match this selector.
  selector:
    matchLabels:
      app: hello-web
  template:
    metadata:
      # This block is one pod. replicas above is how many of these Kubernetes runs.
      # Pods stamped with this label are the ones the selector above adopts and
      # the Service in service.yaml routes traffic to.
      labels:
        app: hello-web
    spec:
      containers:
        - name: hello-web
          # A public sample web app — no registry or build step needed.
          image: mcr.microsoft.com/azuredocs/aks-helloworld:v1 # We can replace here with IMAGE_NAME:IMAGE_TAG from the registry Example: acrlabapi1.azurecr.io/sample-api:v1
          ports:
            - containerPort: 80
          env:
            - name: TITLE
              value: "Deployed from a manifest"
          # Requests reserve capacity for the scheduler; limits cap usage. Set
          # both so one pod cannot starve the node.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Readiness gates traffic: the pod receives requests only once this
          # probe passes. Liveness restarts a pod that stops responding.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

# Autoscaling is a second object, not a field on this Deployment.
# Uncomment only one version, delete replicas: 3 above, then apply again.
# Turn on both and they fight over the same copy count. See LS_NOTES.md.
#
# Version 1 — HPA. Built in. Min is 1. Watches CPU, not HTTP.
# apiVersion: autoscaling/v2
# kind: HorizontalPodAutoscaler
# metadata:
#   name: hello-web
# spec:
#   scaleTargetRef:
#     apiVersion: apps/v1
#     kind: Deployment
#     name: hello-web
#   minReplicas: 1
#   maxReplicas: 6
#   metrics:
#     - type: Resource
#       resource:
#         name: cpu
#         target:
#           type: Utilization
#           averageUtilization: 70
#
# Version 2 — KEDA. Needs az aks update --enable-keda first. Do not also use version 1.
# minReplicaCount: 0 is allowed. A CPU trigger still does not wake on the first HTTP request.
# apiVersion: keda.sh/v1alpha1
# kind: ScaledObject
# metadata:
#   name: hello-web
# spec:
#   scaleTargetRef:
#     name: hello-web
#   minReplicaCount: 1
#   maxReplicaCount: 6
#   triggers:
#     - type: cpu
#       metricType: Utilization
#       metadata:
#         value: "70"
